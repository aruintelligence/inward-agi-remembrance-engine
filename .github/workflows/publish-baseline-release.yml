name: Publish baseline release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-baseline-release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Publish v11.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v11.0.0" >/dev/null 2>&1; then
            echo "Release v11.0.0 already exists."
          else
            gh release create "v11.0.0" --target "$GITHUB_SHA" --title "Inward AGI Remembrance Engine 11.0.0" --notes-file "RELEASE_NOTES_11.0.0.md"
          fi
